name: check

# 送るたびに、Windows・Mac・Linux でテストを実行する。
# コミットの説明に [live] と書いたときだけ、本物の情報源につないで点検する(通知は送らない)。

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: windows-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests (no outside network needed)
        run: python -m unittest discover -s tests -v
      - name: Windows launcher (fx.bat)
        if: runner.os == 'Windows'
        shell: cmd
        run: call fx.bat report < NUL
      - name: Windows background start, status and stop (no outside network needed)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          FXNEWS_HOME: ${{ runner.temp }}\fxhome
          FXNEWS_RATES_URL: http://127.0.0.1:9/ticker
          FXNEWS_GENERAL_SLEEP_BLOCK: "no"
          FXNEWS_NOPAUSE: "1"
        run: |
          mkdir "%FXNEWS_HOME%"
          echo {"feeds": [], "edgar": {}, "x": {"rules": []}} > "%FXNEWS_HOME%\sources.json"
          echo ---- start-hidden.bat
          call start-hidden.bat < NUL
          echo ---- status must say running (exit code 0)
          call fx.bat status < NUL
          if errorlevel 1 exit /b 1
          echo ---- a second copy must refuse to start (exit code 3)
          call fx.bat run --seconds 1 < NUL
          if not errorlevel 3 exit /b 1
          echo ---- stop.bat
          call stop.bat < NUL
          if errorlevel 1 exit /b 1
          echo ---- status must say stopped (exit code 1)
          call fx.bat status < NUL
          if not errorlevel 1 exit /b 1
          echo ---- the log file
          type "%FXNEWS_HOME%\data\fxnews.log"
          exit /b 0
      - name: Windows keep-alive through Task Scheduler (no outside network needed)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          FXNEWS_HOME: ${{ runner.temp }}\fxhome2
          FXNEWS_RATES_URL: http://127.0.0.1:9/ticker
          FXNEWS_GENERAL_SLEEP_BLOCK: "no"
          FXNEWS_NOPAUSE: "1"
        run: |
          mkdir "%FXNEWS_HOME%"
          echo {"feeds": [], "edgar": {}, "x": {"rules": []}} > "%FXNEWS_HOME%\sources.json"
          echo ---- autostart-on.bat: installs the Task Scheduler entry and starts the watcher
          call autostart-on.bat < NUL
          echo ---- the Task Scheduler entry must exist
          schtasks /Query /TN "FX-NEWS mihari" /V /FO LIST
          if errorlevel 1 exit /b 1
          schtasks /Query /TN "FX-NEWS mihari" /XML
          echo ---- status must say running (exit code 0)
          call fx.bat status < NUL
          if errorlevel 1 exit /b 1
          echo ---- stop.bat must stop it and pause the keep-alive
          call stop.bat < NUL
          if errorlevel 1 exit /b 1
          if not exist "%FXNEWS_HOME%\data\autostart.off" exit /b 1
          echo ---- while paused, the keep-alive must not start it (exit code 0, still stopped)
          call fx.bat run --auto < NUL
          if errorlevel 1 exit /b 1
          call fx.bat status < NUL
          if not errorlevel 1 exit /b 1
          echo ---- start-hidden.bat must start it again and clear the pause
          call start-hidden.bat < NUL
          call fx.bat status < NUL
          if errorlevel 1 exit /b 1
          if exist "%FXNEWS_HOME%\data\autostart.off" exit /b 1
          echo ---- while running, the keep-alive must do nothing (exit code 0)
          call fx.bat run --auto < NUL
          if errorlevel 1 exit /b 1
          echo ---- update.bat must stop and start it (a new version would be picked up here)
          call update.bat < NUL
          call fx.bat status < NUL
          if errorlevel 1 exit /b 1
          echo ---- stop, then remove the keep-alive
          call stop.bat < NUL
          if errorlevel 1 exit /b 1
          call autostart-off.bat < NUL
          schtasks /Query /TN "FX-NEWS mihari" >nul 2>nul
          if not errorlevel 1 exit /b 1
          echo ---- the record of commands
          type "%FXNEWS_HOME%\data\commands.log"
          exit /b 0

  live:
    name: live check against the real sources
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check every source once
        run: python run.py check
      - name: Run for 60 seconds without sending notifications
        if: always()
        run: python run.py run --dry --replay 1 --seconds 60
