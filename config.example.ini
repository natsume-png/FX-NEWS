# FX見張り番の設定(見本)
#
# 使い方: このファイルを「config.ini」という名前でコピーして、= の右側を書きかえます。
# config.ini には鍵(かぎ)を書くので、人に見せたり、GitHub に置いたりしないでください
# (.gitignore に書いてあるので、ふつうは GitHub に送られません)。
# 行の先頭が # の行は説明です。プログラムは読みません。

[claude]
# 解説と分類をつける Claude の鍵(API キー)。空のままだと、解説なしで動きます。
api_key =
# 使う頭脳。claude-haiku-5-5 がいちばん速くて安い。
model = claude-haiku-5-5
# 考える深さ(low / medium / high)。low がいちばん速い。
effort = low
# 返事の前の「考える時間」。off で速くなる。on にすると少し遅く、少し高くなる。
thinking = off
# 解説に使うお金の、1か月の上限(円)。届いたら、月が変わるまで解説なしになります。
monthly_cap_yen = 2000

[notify]
# 通知を送るアプリ。ntfy か pushover のどちらかを書きます。
#   ntfy     … 無料の通知アプリ。iPhone では、通知ごとに音を選ぶことはできません。
#   pushover … 通知ごとに音を選べる通知アプリ(有料。スマホの種類ごとに1回払い)。
#              「python run.py setup-pushover」(Windows は setup-pushover.bat)を実行すると、
#              番号を入れたあと、ここが自動で pushover に書きかわります。
service = ntfy
# 重要度(1〜5)がこの数字以上のニュースだけ、スマホを鳴らします。
min_importance = 3
# 急騰急落を、原因の説明を待たずに先に鳴らすか(yes / no)。
# yes だと、数秒後に「原因つき」が届きます。
#   ntfy のとき     … 先に届いた通知が、原因つきに差しかわります。
#   pushover のとき … 音なしの2通目として届きます(原因の手がかりが見つからなかったときは、2通目を送りません)。
spike_fast = yes

[ntfy]
# 通知を配るサーバー。ふつうはこのまま。
server = https://ntfy.sh
# 通知のあて先の名前。空のまま「python run.py topic」を実行すると、自動で作って書きこみます。
topic =
# 1日に送る通知の上限(無料の ntfy.sh は1日250通まで)。
daily_limit = 240

[pushover]
# 受け取り番号(User Key)と、送り主の番号(API Token)。どちらも英数字ちょうど30文字。
# 「python run.py setup-pushover」(Windows は setup-pushover.bat)を実行すると、たずねて書きこみます。
user_key =
api_token =
# 鳴らす音の名前(Pushover にはじめから入っている音。一覧は https://pushover.net/api#sounds )。
# 重要度3のニュースの音。
sound_news = incoming
# 重要度4・5のニュースの音。
sound_important = bugle
# 急騰急落の音。
sound_spike = spacealarm
# プログラムからのお知らせ(情報源につながらない、上限に届いた、など)の音。
sound_system = mechanical
# このプログラムが送る通知の上限(1日と1か月)。
# Pushover が送れる数は、1つのアカウントで月 10,000通まで。同じアカウントのほかの送り主(ほかのプログラム)と分け合います。
# 使い切ると、月が変わるまで、そのアカウントのどの送り主も送れなくなります。
daily_limit = 200
monthly_limit = 5000
# アカウントぜんぶの今月の残りがこの数を切ったら、ニュースと急騰急落の通知を止めます
# (同じアカウントの、ほかのプログラムの通知の分を残しておくため)。0 にすると、残りを見ません。
reserve = 1500

[x]
# X(旧Twitter)の鍵(Bearer Token)。空のままだと、X は使いません。
bearer_token =
# X に使うお金の、1か月の上限(円)。1件 0.005ドルで数えて、届いたら月が変わるまで止めます。
monthly_cap_yen = 5000
# 1日に受け取る投稿の上限(件)。届いたら、日付が変わる(日本時間の午前9時)まで止めます。
daily_cap_posts = 300

[sec]
# 米国の会社の決算の届け出(SEC)を見るための連絡先。SEC の決まりで、名前とメールアドレスを名乗ります。
# 例: contact = Taro Yamada taro@example.com
# 空のままだと、会社の届け出は見張りません。
contact =

[rates]
# 為替レートを何秒おきに見に行くか。
interval_sec = 2
# 急騰急落とみなす動きの大きさ(%)。1分・5分・15分のあいだに、これ以上動いたら知らせます。
threshold_1m = 0.08
threshold_5m = 0.15
threshold_15m = 0.30
# 1回知らせたあと、同じ通貨の組合せを休ませる時間(分)。
cooldown_min = 5

[general]
# 円に直すときの 1ドルの値段(上限の計算に使う)。
usd_jpy = 160
# 動いているあいだ、パソコンが自動でスリープしないようにするか(yes / no)。
sleep_block = yes
# 毎日この時刻(日本時間の 0〜23 時)に、「動いています」という静かな通知を1通送る。-1 で送らない。
heartbeat_hour = 8
# (Windows だけ)黒い画面(コマンドの画面)を置く場所と大きさ。「左,上,幅,高さ」を、画面の点の数で書きます。
# ほかのアプリの画面を、黒い画面でかくしたくないときに使います。空のままなら、動かしません。
# 例: console_rect = 0,0,600,400
console_rect =
